<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reports</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; color: #1a1a1a; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        ul { list-style: none; padding: 0; max-width: 560px; }
        li { border: 1px solid #e5e5e5; border-radius: 8px; padding: 1rem 1.25rem;
             margin-bottom: 0.75rem; }
        li a { font-size: 1.1rem; font-weight: 600; text-decoration: none; color: #2563eb; }
        li a:hover { text-decoration: underline; }
        li p { margin: 0.35rem 0 0; color: #555; }
    </style>
</head>
<body>
    <h1>Reports</h1>
    <ul>
        {% for report in reports %}
            <li>
                <a href="{{ report.url }}">{{ report.name }}</a>
                <p>{{ report.description }}</p>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
